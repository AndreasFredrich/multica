name: Backend Image

# Builds the Go backend (Dockerfile) and publishes it to this fork's GHCR so the
# self-hosted instance can run a fork build (incl. the OIDC login + signup
# allowlist) instead of upstream multica-backend:latest.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/andreasfredrich/multica-backend:latest
            ghcr.io/andreasfredrich/multica-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Web Image

# Builds the Next.js web app (Dockerfile.web) and publishes it to this fork's
# GHCR so the self-hosted instance can run a fork build instead of upstream :latest.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "Dockerfile.web"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/andreasfredrich/multica-web:latest
            ghcr.io/andreasfredrich/multica-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
